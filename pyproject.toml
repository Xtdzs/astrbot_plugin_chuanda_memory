[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chuanda-memory"
version = "0.1.0"
description = "Evidence-backed, identity-scoped group-chat memory with an AstrBot adapter"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.10,<4"]
license = "MIT"

[tool.setuptools.packages.find]
include = ["chuanda_memory*"]
